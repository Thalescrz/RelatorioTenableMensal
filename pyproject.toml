[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-reports"
version = "0.1.0"
description = "Fundacao para coleta reproduzivel e geracao de relatorios Tenable."
requires-python = ">=3.11"
dependencies = [
  "deep-translator>=1.11.4,<2",
  "Pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2.0,<2",
]

[tool.setuptools.package-data]
tenable_reports = [
  "catalogs/*.json",
  "infrastructure/postgresql_migrations/*.sql",
  "webapp/static/*.html",
  "webapp/static/*.css",
  "webapp/static/*.js",
]

[project.scripts]
tenable-reports = "tenable_reports.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
