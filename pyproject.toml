[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-reports"
version = "0.1.0"
description = "Fundacao para coleta reproduzivel e geracao de relatorios Tenable."
requires-python = ">=3.11"
dependencies = [
  "docxcompose>=1.4,<2",
  "Pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2.0,<2",
  "tzdata>=2026.3,<2027",
]

[tool.setuptools.package-data]
tenable_reports = [
  "assets/fonts/*.json",
  "assets/fonts/*.md",
  "assets/fonts/carlito/*.ttf",
  "assets/fonts/liberation-sans/*.ttf",
  "catalogs/*.json",
  "infrastructure/postgresql_migrations/*.sql",
  "webapp/static/*.html",
  "webapp/static/*.css",
  "webapp/static/*.js",
]

[tool.setuptools.data-files]
"share/tenable-reports/templates/corporate" = [
  "templates/corporate/*.docx",
  "templates/corporate/*.md",
]
"share/tenable-reports/templates/corporate/assets" = [
  "templates/corporate/assets/*.png",
]

[project.scripts]
tenable-reports = "tenable_reports.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
